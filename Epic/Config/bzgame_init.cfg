// ================================
// BATTLEZONE EDITOR INITIALIZATION
// ================================

Exec("bzgame_init_colors.cfg"); // Moved Colors to a single place.

Cmd("gameprefs.Play_MapRadarHeight 156");
Cmd("gameprefs.Play_MapRadarWidth 156");
Cmd("gameprefs.Play_MapRadarXDiff 30");
Cmd("gameprefs.Play_MapRadarYDiff -10");

Cmd("gameprefs.Edit_MapRadarHeight 156");
Cmd("gameprefs.Edit_MapRadarWidth 156");
Cmd("gameprefs.Edit_MapRadarXDiff -30");
Cmd("gameprefs.Edit_MapRadarYDiff -10");

Cmd("gameprefs.Play_CockpitRadarHeight 220");
Cmd("gameprefs.Play_CockpitRadarWidth 220");
Cmd("gameprefs.Play_CockpitRadarXDiff 25");
Cmd("gameprefs.Play_CockpitRadarYDiff 25");

Cmd("gameprefs.Play_CockpitRadarColorR 0");
Cmd("gameprefs.Play_CockpitRadarColorG 138");
Cmd("gameprefs.Play_CockpitRadarColorB 138");

//
// CONFIGURE FONTS
//
ConfigureInterface()
{
	//to mod these fonts, supply your fonts for the folloing sizes
	//example: CreateFontRedux("LARGE", "myfontfile");
	//system will look for files like "myfontfile_15.bmf" and "myfontfile_10.bmf"
	//so make sure you have provided those files
	
	
	CreateFontRedux("LARGE", "bgmm");
	CreateFontRedux("MEDIUM", "bgmm");
	CreateFontRedux("SMALL", "bgmm");
	CreateFontRedux("TINY", "ds");
	CreateFontRedux("SYSTEM", "bgmm");
}

//
// CONFIGURE CURSORS
//
ConfigureCursors()
{
	// DEFAULT CURSOR
	CreateCursor("Default")
	{
		Size(32, 32);
		Hotspot(5, 10);
		Image("cursor.tga");
		Frames(0, 15);
  	}

	// HIGHLIGHT CURSOR
	CreateCursor("Highlight")
  	{
	    	Size(32, 32);
    		Hotspot(5, 10);
    		Image("cursor.tga");
		Frames(0, 15);
  	}

	// SET STANDARD CURSORS
  	StandardCursors()
	{
		Default("Default");
		IBeam("Default");
		Wait("Default");
		No("Default");
	}
}
